<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT BOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .message-appear { animation: fadeInUp 0.3s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        pre { background: #f4f4f4; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col">

    <header class="w-full py-4 px-6 glass border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <div class="w-3 h-3 bg-white rounded-full animate-pulse"></div>
            </div>
            <h1 class="text-xl font-semibold tracking-tight">CHAT<span class="text-blue-600">BOT</span></h1>
        </div>
        <span class="text-xs font-medium px-2 py-1 bg-green-100 text-green-700 rounded-full">v2.5 Online</span>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 max-w-4xl mx-auto w-full">
        <div class="flex flex-col items-center justify-center h-full text-center opacity-60" id="welcome-screen">
            <p class="text-lg">How can I help you today?</p>
            <p class="text-sm">Type a message below to start chatting with the AI.</p>
        </div>
    </main>

    <footer class="p-4 bg-white border-t border-slate-200">
        <div class="max-w-4xl mx-auto relative">
            <form id="chat-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Ask me anything..." 
                    class="w-full p-4 pr-12 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
                    required
                >
                <button 
                    type="submit" 
                    id="send-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl transition-colors shadow-lg shadow-blue-200"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </footer>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');

        function appendMessage(role, content) {
            if (welcomeScreen) welcomeScreen.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message-appear`;

            const innerDiv = document.createElement('div');
            innerDiv.className = `max-w-[80%] p-4 rounded-2xl ${
                role === 'user' 
                ? 'bg-blue-600 text-white rounded-tr-none' 
                : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm'
            }`;

            // Render markdown for AI, plain text for user
            innerDiv.innerHTML = role === 'ai' ? marked.parse(content) : content;
            
            msgDiv.appendChild(innerDiv);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.id = 'ai-loader';
            loader.className = 'flex justify-start message-appear';
            loader.innerHTML = `
                <div class="bg-white border border-slate-200 p-4 rounded-2xl rounded-tl-none shadow-sm">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                        <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(loader);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // User UI update
            appendMessage('user', message);
            userInput.value = '';
            
            showLoading();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: message })
                });

                const data = await response.text();
                
                // Remove loader and show AI response
                document.getElementById('ai-loader').remove();
                appendMessage('ai', data);

            } catch (error) {
                document.getElementById('ai-loader').remove();
                appendMessage('ai', "⚠️ Sorry, I'm having trouble connecting to the server.");
                console.error("Fetch error:", error);
            }
        });
    </script>
</body>
</html>
